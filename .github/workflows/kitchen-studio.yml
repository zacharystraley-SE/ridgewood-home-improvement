name: Kitchen Studio

on:
  push:
    branches: [main]
    paths:
      - "kitchen-studio-api/**"
      - "kitchen-studio-app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kitchen-studio.yml"
  workflow_dispatch:

jobs:
  test-and-deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: kitchen-studio-api
      - run: npm test
      - run: git diff --exit-code -- kitchen-studio
      - run: npx wrangler deploy
        working-directory: kitchen-studio-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
